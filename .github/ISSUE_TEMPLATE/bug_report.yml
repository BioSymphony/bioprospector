name: Bug report
description: Report a local BioProspector problem without sharing private data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste credentials, private paths, provider IDs, raw biological data, unpublished sequences, or full run logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Local command
      description: Paste the command with private paths redacted.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Redacted output
      description: Include the smallest useful output. Redact secrets, account IDs, provider IDs, private paths, and raw data.
      render: text
  - type: checkboxes
    id: boundary
    attributes:
      label: Public-safety confirmation
      options:
        - label: I removed credentials, tokens, private paths, provider IDs, and raw/private biological data.
          required: true
